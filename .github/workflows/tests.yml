name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    name: Pytest (ubuntu, python 3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Show installed packages
        run: python -m pip list

      - name: Run unit and integration tests
        # The browser tests (Selenium) are deselected on CI: no browser is
        # installed in the runner, the fixtures would skip them anyway.
        run: python -m pytest -v -m "unit or integration" --junitxml=reports/junit.xml

      - name: Upload test + link reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
            logs/
          if-no-files-found: warn
          retention-days: 7
