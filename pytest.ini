[pytest]
# Where the tests live
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -r a = summary of all outcomes, --durations = slowest 10 tests
addopts = -ra --durations=10 --strict-markers --color=yes
filterwarnings =
    ignore::DeprecationWarning:selenium.*

# Test categories:
#   unit        - pure logic, no socket, no browser
#   integration - uses a local HTTP test server (127.0.0.1), still no browser
#   browser     - launches a real browser through Selenium
markers =
    unit: fast test of pure logic (no network, no browser)
    integration: test of the HTTP link checker against a local test server
    browser: Selenium/browser test (auto skipped when no browser is available)

# Optional HTML test report:
#   pytest --html=reports/pytest_report.html --self-contained-html
